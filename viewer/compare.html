<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Boulder Compare</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #0a0a0a; color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; }

#app { display: flex; flex-direction: column; height: 100dvh; }

/* ── Composite canvas ───────────────────────────────────── */
#stage {
  flex: 1; position: relative; background: #000; min-height: 0;
  display: flex; align-items: center; justify-content: center;
}
#composite { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }

/* Route-Zeit overlay */
#route-time {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,.65); border-radius: 20px; padding: 4px 14px;
  font-size: 15px; font-weight: 700; letter-spacing: .03em;
  pointer-events: none;
}
/* Mode toggle */
#mode-btn {
  position: absolute; top: 10px; right: 10px;
  background: rgba(0,0,0,.6); border: 1px solid #444; color: #fff;
  border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer;
}

/* ── Winner banner ──────────────────────────────────────── */
#winner {
  flex-shrink: 0;
  display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
  background: #111; border-top: 1px solid #1e1e1e;
}
.stat-pill {
  padding: 10px 12px;
  background: #0d0d0d;
  display: flex; flex-direction: column; gap: 2px;
}
.stat-pill .label { font-size: 10px; opacity: .4; text-transform: uppercase; letter-spacing: .06em; }
.stat-pill .value { font-size: 18px; font-weight: 800; }
.stat-pill .sub   { font-size: 11px; opacity: .5; }
.faster  { color: #4aaeff; }
.slower  { color: #ffaa44; }
.neutral { color: #aaa; }

/* ── Hold timeline ──────────────────────────────────────── */
#timeline {
  flex-shrink: 0; padding: 8px 16px 10px; background: #0d0d0d;
  border-top: 1px solid #1e1e1e;
}
#tl-label { font-size: 10px; opacity: .35; text-transform: uppercase;
  letter-spacing: .06em; margin-bottom: 6px; }
#hold-track {
  position: relative; height: 52px;
}
#hold-track::before {
  content: ''; position: absolute; top: 50%; left: 0; right: 0;
  height: 1px; background: #2a2a2a; transform: translateY(-50%);
}
.hcol {
  position: absolute; top: 0; bottom: 0; width: 32px; margin-left: -16px;
  display: flex; flex-direction: column; align-items: center;
  justify-content: space-between; cursor: pointer;
}
.hcol:active .hnode { transform: scale(1.2); }
.hdot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.hdot-p1 { background: #4aaeff; }
.hdot-p2 { background: #ffaa44; }
.hdot-empty { background: transparent; border: 1px solid #333; }
.hnode {
  width: 24px; height: 24px; border-radius: 50%;
  border: 1.5px solid #333; background: #111;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700; color: #666;
  transition: transform .12s, border-color .12s;
  flex-shrink: 0;
}
.hcol.active .hnode { border-color: #fff; color: #fff; background: #2a2a2a; }
.hcol.is-top   .hnode { border-color: #ffe44a; color: #ffe44a; }
.hcol.is-start .hnode { border-color: #66ff88; color: #66ff88; }

/* ── Controls ───────────────────────────────────────────── */
#controls {
  flex-shrink: 0; display: flex; gap: 8px; align-items: center;
  padding: 8px 12px; background: #080808; border-top: 1px solid #1a1a1a;
}
.ctrl-btn {
  background: #1c1c1c; border: none; color: #fff;
  padding: 9px 16px; border-radius: 8px; font-size: 13px;
  font-weight: 600; cursor: pointer; flex-shrink: 0;
}
.ctrl-btn:active { background: #333; }
#route-progress {
  flex: 1; height: 3px; background: #2a2a2a; border-radius: 2px;
  position: relative; cursor: pointer;
}
#rp-fill { height: 100%; border-radius: 2px;
  background: linear-gradient(90deg, #4aaeff, #ffaa44); width: 0%; }
</style>
</head>
<body>
<div id="app">

  <!-- Hidden videos -->
  <video id="v1" src="/output/p1_processed.mp4" preload="auto" playsinline muted style="display:none"></video>
  <video id="v2" src="/output/p2_processed.mp4" preload="auto" playsinline muted style="display:none"></video>

  <!-- Overlay canvas -->
  <div id="stage">
    <canvas id="composite"></canvas>
    <div id="route-time">t +0.0s</div>
    <button id="mode-btn">👁 Beide</button>
  </div>

  <!-- Stats -->
  <div id="winner">
    <div class="stat-pill" id="sp-time">
      <div class="label">Routenzeit</div>
      <div class="value neutral">—</div>
      <div class="sub">—</div>
    </div>
    <div class="stat-pill" id="sp-com">
      <div class="label">CoM-Pfad</div>
      <div class="value neutral">—</div>
      <div class="sub">—</div>
    </div>
  </div>

  <!-- Hold timeline -->
  <div id="timeline">
    <div id="tl-label">Holds — Tippen zum Springen</div>
    <div id="hold-track"></div>
  </div>

  <!-- Controls -->
  <div id="controls">
    <button class="ctrl-btn" id="btn-start">↩ Start</button>
    <div id="route-progress"><div id="rp-fill"></div></div>
  </div>

</div>

<script>
const SRC_W = 540, SRC_H = 960;
const MODES = ['Beide', 'P1', 'P2'];
let modeIdx = 0;

const v1 = document.getElementById('v1');
const v2 = document.getElementById('v2');
const cvs = document.getElementById('composite');
const ctx = cvs.getContext('2d');

let data = null;
let p1s = 0, p2s = 0; // route_start_t offsets

// ── Resize canvas to match stage ─────────────────────────
function resize() {
  const stage = document.getElementById('stage');
  const stageW = stage.clientWidth;
  const stageH = stage.clientHeight;
  const aspect = SRC_W / SRC_H;
  let w = stageW, h = stageW / aspect;
  if (h > stageH) { h = stageH; w = h * aspect; }
  cvs.width  = Math.round(w);
  cvs.height = Math.round(h);
  cvs.style.width  = cvs.width  + 'px';
  cvs.style.height = cvs.height + 'px';
}
window.addEventListener('resize', resize);

// ── Composite draw ────────────────────────────────────────
function drawFrame() {
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  const mode = MODES[modeIdx];

  if (mode === 'Beide' || mode === 'P1') {
    ctx.globalAlpha = 1.0;
    ctx.drawImage(v1, 0, 0, cvs.width, cvs.height);
  }
  if (mode === 'Beide' || mode === 'P2') {
    ctx.globalAlpha = mode === 'Beide' ? 0.55 : 1.0;
    // Warm tint for P2
    ctx.drawImage(v2, 0, 0, cvs.width, cvs.height);
    if (mode === 'Beide') {
      ctx.globalCompositeOperation = 'multiply';
      ctx.fillStyle = 'rgba(255,190,100,0.18)';
      ctx.fillRect(0, 0, cvs.width, cvs.height);
      ctx.globalCompositeOperation = 'source-over';
    }
  }
  ctx.globalAlpha = 1.0;
}

// ── Route time & progress ────────────────────────────────
function routeTime() {
  if (!data) return 0;
  // Route time = current video time minus route_start offset
  const t1 = v1.currentTime - p1s;
  return Math.max(0, t1);
}

function updateRouteTime() {
  const rt = routeTime();
  document.getElementById('route-time').textContent = `t +${rt.toFixed(1)}s`;

  // Update progress bar
  const maxDur = Math.max(
    data?.player1?.route_duration || 0,
    data?.player2?.route_duration || 0
  );
  if (maxDur > 0) {
    document.getElementById('rp-fill').style.width = Math.min(100, rt / maxDur * 100) + '%';
  }
}

// ── Route-time control: the one place that sets currentTime ─
// rt = seconds since route_start_t, shared by both players.
function maxRouteDuration() {
  return Math.max(
    data?.player1?.route_duration || 0,
    data?.player2?.route_duration || 0
  );
}

// Upper bound for scrubbing: known route_duration if both players reached
// the top hold, otherwise fall back to whichever video runs longer past
// its own route_start_t (route_duration can be null — see Task 0 note).
function maxRouteTime() {
  const known = maxRouteDuration();
  if (known > 0) return known;
  return Math.max((v1.duration || 0) - p1s, (v2.duration || 0) - p2s, 0);
}

function setRouteTime(rt) {
  if (!data) return;
  rt = Math.max(0, Math.min(rt, maxRouteTime()));
  v1.currentTime = Math.max(0, Math.min(p1s + rt, v1.duration || Infinity));
  v2.currentTime = Math.max(0, Math.min(p2s + rt, v2.duration || Infinity));
  updateRouteTime();
}

// ── RAF loop ──────────────────────────────────────────────
function loop() {
  resize(); // no-op if size unchanged since we only set once
  drawFrame();
  if (data) updateRouteTime();
  requestAnimationFrame(loop);
}

// ── Mouse-drag scrubbing on the video ────────────────────
// Drag up = move forward along the route (climbing up).
const DRAG_PX_PER_SEC = 200; // 200px vertical drag ≈ 1s of route time
const stageEl = document.getElementById('stage');
let dragging = false;
let dragStartY = 0;
let dragStartRt = 0;

stageEl.addEventListener('mousedown', (e) => {
  if (!data) return;
  dragging = true;
  dragStartY = e.clientY;
  dragStartRt = routeTime();
  e.preventDefault();
});

window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const deltaY = e.clientY - dragStartY;
  const deltaSec = -deltaY / DRAG_PX_PER_SEC;
  setRouteTime(dragStartRt + deltaSec);
});

window.addEventListener('mouseup', () => { dragging = false; });

stageEl.addEventListener('wheel', (e) => {
  if (!data) return;
  e.preventDefault();
  const deltaSec = -e.deltaY / (DRAG_PX_PER_SEC * 4); // finer than drag
  setRouteTime(routeTime() + deltaSec);
}, { passive: false });

// ── Progress bar: click/drag for absolute jumps ──────────
const progressEl = document.getElementById('route-progress');
let progressDragging = false;

function progressEventToRt(e) {
  const rect = progressEl.getBoundingClientRect();
  const frac = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  return frac * maxRouteTime();
}

progressEl.addEventListener('mousedown', (e) => {
  if (!data) return;
  progressDragging = true;
  setRouteTime(progressEventToRt(e));
  e.preventDefault();
});

window.addEventListener('mousemove', (e) => {
  if (!progressDragging) return;
  setRouteTime(progressEventToRt(e));
});

window.addEventListener('mouseup', () => { progressDragging = false; });

// ── Hold timeline ─────────────────────────────────────────
function buildTimeline() {
  const track = document.getElementById('hold-track');
  track.innerHTML = '';
  const holds = [...data.route.holds].sort((a, b) => b.y - a.y); // start left
  const n = holds.length;

  holds.forEach((hold, i) => {
    const pct = n === 1 ? 50 : (i / (n - 1)) * 100;
    const col = document.createElement('div');
    col.className = 'hcol' +
      (hold.role === 'top'   ? ' is-top'   : '') +
      (hold.role === 'start' ? ' is-start' : '');
    col.style.left = pct + '%';
    col.dataset.id = hold.id;

    const ev1 = data.player1.hold_events.find(e => e.hold_id === hold.id);
    const ev2 = data.player2.hold_events.find(e => e.hold_id === hold.id);

    const d1 = document.createElement('div');
    d1.className = 'hdot ' + (ev1 ? 'hdot-p1' : 'hdot-empty');
    d1.title = ev1 ? `P1: ${ev1.t.toFixed(1)}s` : 'P1: —';

    const node = document.createElement('div');
    node.className = 'hnode';
    node.textContent = hold.role === 'top' ? '▲' : (hold.role === 'start' ? 'S' : hold.id);

    const d2 = document.createElement('div');
    d2.className = 'hdot ' + (ev2 ? 'hdot-p2' : 'hdot-empty');
    d2.title = ev2 ? `P2: ${ev2.t.toFixed(1)}s` : 'P2: —';

    col.append(d1, node, d2);
    col.addEventListener('click', () => jumpToHold(hold.id));
    track.appendChild(col);
  });
}

function jumpToHold(holdId) {
  const ev1 = data.player1.hold_events.find(e => e.hold_id === holdId);

  // Jump to 1.5s before P1 reached this hold (or route start)
  const absT1 = ev1 ? Math.max(0, ev1.t - 1.5) : p1s;
  setRouteTime(absT1 - p1s);

  document.querySelectorAll('.hcol').forEach(c =>
    c.classList.toggle('active', parseInt(c.dataset.id) === holdId));
}

// ── Stats ─────────────────────────────────────────────────
function buildStats() {
  const p1 = data.player1, p2 = data.player2;

  // Time
  const d1 = p1.route_duration, d2 = p2.route_duration;
  const spTime = document.getElementById('sp-time');
  if (d1 && d2) {
    const faster = d1 < d2 ? 'P1' : 'P2';
    const diff = Math.abs(d1 - d2).toFixed(1);
    const fColor = d1 < d2 ? 'faster' : 'slower';
    const sColor = d1 < d2 ? 'slower' : 'faster';
    spTime.querySelector('.value').textContent = `${faster} +${diff}s`;
    spTime.querySelector('.value').className = `value ${fColor}`;
    spTime.querySelector('.sub').textContent =
      `P1: ${d1?.toFixed(1) ?? '—'}s · P2: ${d2?.toFixed(1) ?? '—'}s`;
  }

  // CoM
  const l1 = p1.com_path_length, l2 = p2.com_path_length;
  const spCom = document.getElementById('sp-com');
  if (l1 && l2) {
    const eff = d1 > 0 ? l1 / d1 : 0;
    const eff2 = d2 > 0 ? l2 / d2 : 0;
    const better = eff < eff2 ? 'P1' : 'P2';
    const pct = Math.round(Math.abs(eff - eff2) / Math.max(eff, eff2) * 100);
    const bColor = eff < eff2 ? 'faster' : 'slower';
    spCom.querySelector('.value').textContent = `${better} ${pct}% effizienter`;
    spCom.querySelector('.value').className = `value ${bColor}`;
    spCom.querySelector('.sub').textContent =
      `P1: ${Math.round(l1 / 100)} · P2: ${Math.round(l2 / 100)} (px/100)`;
  }
}

// ── Controls ──────────────────────────────────────────────
document.getElementById('btn-start').addEventListener('click', () => {
  setRouteTime(0);
  document.querySelectorAll('.hcol').forEach(c => c.classList.remove('active'));
  const startCol = document.querySelector('.hcol.is-start');
  if (startCol) startCol.classList.add('active');
});

document.getElementById('mode-btn').addEventListener('click', function () {
  modeIdx = (modeIdx + 1) % MODES.length;
  this.textContent = '👁 ' + MODES[modeIdx];
});

// ── Init ──────────────────────────────────────────────────
fetch('/output/comparison.json')
  .then(r => r.json())
  .then(d => {
    data = d;
    p1s = d.player1.route_start_t ?? 0;
    p2s = d.player2.route_start_t ?? 0;

    buildTimeline();
    buildStats();
    resize();

    // Jump both to start hold moment
    setRouteTime(0);

    // Highlight start hold
    const startHold = d.route.holds.find(h => h.role === 'start');
    if (startHold) {
      const col = document.querySelector(`[data-id="${startHold.id}"]`);
      if (col) col.classList.add('active');
    }

    loop();
  });
</script>
</body>
</html>
